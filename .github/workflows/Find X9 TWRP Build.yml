name: Find X9 TWRP Build

on:
  workflow_dispatch:

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses-dev libssl-dev libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Install Java 11
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          sudo ln -sf "$HOME/bin/repo" /usr/local/bin/repo

      - name: Cache TWRP repo objects
        uses: actions/cache@v4
        with:
          path: workspace/.repo
          key: twrp-14.1-repo-${{ runner.os }}-${{ hashFiles('.github/workflows/Find X9 TWRP Build.yml') }}
          restore-keys: |
            twrp-14.1-repo-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: twrp-14.1-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            twrp-14.1-ccache-${{ runner.os }}-

      - name: Initialize TWRP source
        working-directory: ${{ github.workspace }}
        run: |
          set -euxo pipefail
          mkdir -p workspace
          cd workspace
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14.1
          repo sync -c --force-sync --no-clone-bundle --no-tags -j8
          test -f build/envsetup.sh

      - name: Add OPPO Find X9 device tree
        working-directory: workspace
        run: |
          git clone --depth=1 \
            https://github.com/tosasitill/android_device_oppo_plj110.git \
            -b main device/oppo/findx9

      - name: Add swap
        run: |
          set -euxo pipefail
          if ! swapon --show | grep -q .; then
            sudo fallocate -l 12G /swapfile-findx9
            sudo chmod 600 /swapfile-findx9
            sudo mkswap /swapfile-findx9
            sudo swapon /swapfile-findx9
          fi
          free -h
          swapon --show

      - name: Build vendor_boot image
        working-directory: workspace
        env:
          ALLOW_MISSING_DEPENDENCIES: 'true'
        run: |
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 10G
          ccache -z
          source build/envsetup.sh
          lunch twrp_findx9-ap2a-eng
          # TWRP 14.1 recovery packaging may copy the device fstab into
          # system/etc before the empty staging tree exists.
          mkdir -p out/target/product/findx9/root/system/etc
          mkdir -p out/target/product/findx9/recovery/root/system/etc
          mkdir -p out/target/product/findx9/vendor_ramdisk
          test -s device/oppo/findx9/prebuilt/mt6993.dtb
          stat -c '%s %n' device/oppo/findx9/prebuilt/mt6993.dtb
          make vendorbootimage -j"$(nproc --all)"
          ccache -s

      - name: Collect build artifacts
        if: always()
        run: |
          mkdir -p artifacts
          find workspace/out/target/product/findx9 -maxdepth 1 -type f \
            \( -name '*.img' -o -name '*.zip' -o -name '*.txt' \) \
            -exec cp -v {} artifacts/ \; 2>/dev/null || true
          cp -v workspace/out/soong.log artifacts/ 2>/dev/null || true

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findx9-twrp-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn

      - name: Upload release artifacts
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: findx9-${{ github.run_number }}
          name: Find X9 TWRP build ${{ github.run_number }}
          files: artifacts/*
          body: |
            Device: OPPO Find X9 PLJ110 / OP5E17L1
            Target: vendor_boot.img
            Product: twrp_findx9-eng
            Manifest: TWRP 14.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

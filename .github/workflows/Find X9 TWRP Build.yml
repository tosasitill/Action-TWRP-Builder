name: Find X9 TWRP Build

on:
  workflow_dispatch:

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses-dev libssl-dev libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Install Java 11
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          sudo ln -sf "$HOME/bin/repo" /usr/local/bin/repo

      - name: Cache TWRP repo objects
        uses: actions/cache@v4
        with:
          path: workspace/.repo
          key: twrp-14.1-repo-${{ runner.os }}-${{ hashFiles('.github/workflows/Find X9 TWRP Build.yml') }}
          restore-keys: |
            twrp-14.1-repo-${{ runner.os }}-

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: twrp-14.1-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            twrp-14.1-ccache-${{ runner.os }}-

      - name: Initialize TWRP source
        working-directory: ${{ github.workspace }}
        run: |
          set -euxo pipefail
          mkdir -p workspace
          cd workspace
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14.1
          repo sync -c --force-sync --no-clone-bundle --no-tags -j8
          test -f build/envsetup.sh

      - name: Add OPPO Find X9 device tree
        working-directory: workspace
        run: |
          git clone --depth=1 \
            https://github.com/tosasitill/android_device_oppo_plj110.git \
            -b main device/oppo/findx9

      - name: Add swap
        run: |
          set -euxo pipefail
          if ! swapon --show | grep -q .; then
            sudo fallocate -l 12G /swapfile-findx9
            sudo chmod 600 /swapfile-findx9
            sudo mkswap /swapfile-findx9
            sudo swapon /swapfile-findx9
          fi
          free -h
          swapon --show

      - name: Build vendor_boot image
        working-directory: workspace
        env:
          ALLOW_MISSING_DEPENDENCIES: 'true'
          USE_CCACHE: '1'
          CCACHE_DIR: /home/runner/.ccache
          CCACHE_EXEC: /usr/bin/ccache
        run: |
          set -eo pipefail
          export PATH="/usr/lib/ccache:$PATH"
          ccache -M 10G
          ccache --zero-stats
          ccache --show-config
          command -v ccache
          source build/envsetup.sh
          lunch twrp_findx9-ap2a-eng
          mkdir -p out/target/product/findx9/root/system/etc
          mkdir -p out/target/product/findx9/recovery/root/system/etc
          mkdir -p out/target/product/findx9/root/linkerconfig
          mkdir -p out/target/product/findx9/recovery/root/linkerconfig
          mkdir -p out/target/product/findx9/vendor_ramdisk
          test -s device/oppo/findx9/prebuilt/mt6993.dtb
          stat -c '%s %n' device/oppo/findx9/prebuilt/mt6993.dtb
          make vendorbootimage -j"$(nproc --all)"
          ccache --show-stats

      - name: Compose stock-based vendor_boot
        working-directory: workspace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p stock-input
          gh release download findx9-16 \
            --repo tosasitill/Action-TWRP-Builder \
            --pattern vendor_boot_b.img \
            --dir stock-input
          mv stock-input/vendor_boot_b.img stock-input/stock_vendor_boot_b.img
          test "$(stat -c '%s' stock-input/stock_vendor_boot_b.img)" -eq 100663296
          recovery_fragment=$(find out/target/product/findx9/obj/PACKAGING/vendor_ramdisk_fragments_intermediates -name 'recovery.cpio.gz' -type f -size +0c | head -1)
          test -n "$recovery_fragment"
          python3 - "$recovery_fragment" stock-input/stock_vendor_boot_b.img out/target/product/findx9/vendor_boot_stock_twrp.img <<'PYCODE'
          import struct
          import sys
          from pathlib import Path

          recovery_path, stock_path, out_path = map(Path, sys.argv[1:])
          stock = stock_path.read_bytes()
          recovery = recovery_path.read_bytes()
          U = lambda off: struct.unpack_from('<I', stock, off)[0]
          page = U(12)
          old_ramdisk_size = U(24)
          header_size = U(2096)
          dtb_size = U(2100)
          table_size = U(2112)
          entry_num = U(2116)
          entry_size = U(2120)
          bootconfig_size = U(2124)
          assert stock[:8] == b'VNDRBOOT'
          assert U(8) == 4 and page == 4096 and header_size == 2128
          assert entry_num == 2 and entry_size == 108
          assert table_size == entry_num * entry_size and dtb_size > 0

          ramdisk_off = page
          dtb_off = ramdisk_off + ((old_ramdisk_size + page - 1) // page) * page
          table_off = dtb_off + ((dtb_size + page - 1) // page) * page
          bootconfig_off = table_off + ((table_size + page - 1) // page) * page
          table = bytearray(stock[table_off:table_off + table_size])

          platform_size, platform_offset, platform_type = struct.unpack_from('<III', table, 0)
          recovery_size, recovery_offset, recovery_type = struct.unpack_from('<III', table, entry_size)
          assert platform_type == 1 and platform_offset == 0
          assert recovery_type == 2 and recovery_offset == platform_size
          assert platform_size + recovery_size <= old_ramdisk_size

          platform = stock[ramdisk_off:ramdisk_off + platform_size]
          dtb = stock[dtb_off:dtb_off + dtb_size]
          bootconfig = stock[bootconfig_off:bootconfig_off + bootconfig_size]
          new_ramdisk = platform + recovery

          struct.pack_into('<I', table, 0, platform_size)
          struct.pack_into('<I', table, entry_size, len(recovery))
          struct.pack_into('<I', table, entry_size + 4, platform_size)

          result = bytearray(stock[:page])
          struct.pack_into('<I', result, 24, len(new_ramdisk))
          result.extend(new_ramdisk)
          result.extend(b'\0' * ((page - len(result) % page) % page))
          result.extend(dtb)
          result.extend(b'\0' * ((page - len(result) % page) % page))
          result.extend(table)
          result.extend(b'\0' * ((page - len(result) % page) % page))
          result.extend(bootconfig)
          result.extend(b'\0' * ((page - len(result) % page) % page))
          assert len(result) <= 100663296
          result.extend(b'\0' * (100663296 - len(result)))
          out_path.write_bytes(result)
          print('platform_fragment=', platform_size)
          print('recovery_fragment=', len(recovery))
          print('vendor_ramdisk_size=', len(new_ramdisk))
          print('vendor_boot_size=', len(result))
          print('dtb_size=', len(dtb), 'bootconfig_size=', len(bootconfig))
          PYCODE
          test "$(stat -c '%s' out/target/product/findx9/vendor_boot_stock_twrp.img)" -eq 100663296

      - name: Collect build artifacts
        if: always()
        run: |
          mkdir -p artifacts
          find workspace/out/target/product/findx9 -maxdepth 1 -type f \
            \( -name '*.img' -o -name '*.zip' -o -name '*.txt' \) \
            -exec cp -v {} artifacts/ \; 2>/dev/null || true
          cp -v workspace/out/target/product/findx9/vendor_boot_stock_twrp.img artifacts/ 2>/dev/null || true
          cp -v workspace/out/soong.log artifacts/ 2>/dev/null || true

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findx9-twrp-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn

      - name: Show and save ccache stats
        if: always()
        working-directory: workspace
        run: |
          ccache --show-stats || true
          du -sh "$HOME/.ccache" || true

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: twrp-14.1-ccache-${{ runner.os }}-${{ github.run_id }}

      - name: Upload release artifacts
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: findx9-${{ github.run_number }}
          name: Find X9 TWRP build ${{ github.run_number }}
          files: artifacts/*
          body: |
            Device: OPPO Find X9 PLJ110 / OP5E17L1
            Target: vendor_boot.img
            Product: twrp_findx9-eng
            Manifest: TWRP 14.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
